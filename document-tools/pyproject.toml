[project]
name = "aclais-document-tools"
version = "0.1.0"
description = "Local Document Tools website and fixed Report Formatter worker"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/document_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "portable: platform-independent checks that do not establish Windows enforcement",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "workers", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
