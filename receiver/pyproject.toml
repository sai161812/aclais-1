[project]
name = "aclais-local-receiver"
version = "0.1.0"
description = "Independent local receipt collection service for ACLAIS"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "pydantic==2.14.1",
    "uvicorn==0.54.0",
]

[project.scripts]
aclais-receiver = "receiver.cli:main"

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/receiver"]
artifacts = ["src/receiver/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "portable: platform-independent checks that do not establish Windows ACL enforcement",
    "windows_runtime_acl: actual Windows DACL verification for owner-only receiver storage",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
