[project]
name = "aclais-backend"
version = "0.1.0"
description = "Local ACLAIS controller foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "pydantic==2.14.1",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "pytest==9.2.0",
    "ruff==0.17.3",
]
windows-enforcement = [
    "playwright>=1.64.1",
]

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aclais"]
artifacts = ["src/aclais/persistence/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "portable: platform-independent checks that do not establish Windows enforcement",
    "windows_enforcement: actual Windows identity, NTFS, Credential Manager, or Job Object enforcement checks",
    "windows_ui: isolated browser presentation fixtures; never enforcement evidence",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
